services:
  squad-estoque:
    build:
      context: .
      dockerfile: Dockerfile
    image: squad-estoque:local
    init: true
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      AllowedHosts: "${AllowedHosts:-localhost;127.0.0.1;[::1]}"
      DataProtection__KeysPath: /app/data/keys
      ConnectionStrings__EstoqueContext: Data Source=/app/data/Estoque.db
    volumes:
      - squad-estoque-data:/app/data

volumes:
  squad-estoque-data:
    name: squad-estoque-data
