services:
  squad-estoque:
    build:
      context: .
      dockerfile: Dockerfile
    image: squad-estoque:local
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - path: .env.compose
        required: false
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      AllowedHosts: "${AllowedHosts:-localhost;127.0.0.1;[::1]}"
      DataProtection__KeysPath: "${DataProtection__KeysPath:-/app/data/keys}"
      ConnectionStrings__EstoqueContext: "${ConnectionStrings__EstoqueContext:-Data Source=/app/data/Estoque.db}"
    volumes:
      - squad-estoque-data:/app/data

volumes:
  squad-estoque-data:
    name: squad-estoque-data
