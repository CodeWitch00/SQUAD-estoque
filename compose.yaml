services:
  squad-estoque:
    build:
      context: .
      dockerfile: Dockerfile
    image: squad-estoque:local
    container_name: squad-estoque
    init: true
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - path: .env.compose
        required: false
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DataProtection__KeysPath: /app/data/keys
      ConnectionStrings__EstoqueContext: Data Source=/app/data/Estoque.db
    volumes:
      - squad-estoque-data:/app/data

volumes:
  squad-estoque-data:
    name: squad-estoque-data
