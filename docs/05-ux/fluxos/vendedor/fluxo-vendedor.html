    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))

.form-check:not(.form-switch)

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;

}

  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {

.form-check-label {

.form-switch .form-check-input::before {

  box-shadow: var(--shadow-sm);

.form-switch .form-check-input:checked {

.form-switch .form-check-input:checked::before {

      function safe(value) {
        return String(value).replace(/[&amp;&lt;&gt;&#x27;&quot;]/g, char =&gt; ({
          &#x27;&amp;&#x27;: &#x27;&amp;amp;&#x27;, &#x27;&lt;&#x27;: &#x27;&amp;lt;&#x27;, &#x27;&gt;&#x27;: &#x27;&amp;gt;&#x27;, &quot;&#x27;&quot;: &#x27;&amp;#39;&#x27;, &#x27;&quot;&#x27;: &#x27;&amp;quot;&#x27;
        })[char]);
      }

      function icons() {
        if (window.lucide) {
          window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
        }
      }

      function appbar(title, eyebrow, backAction) {
        const back = backAction
          ? `&lt;button class=&quot;sq-icon-button&quot; type=&quot;button&quot; data-action=&quot;${backAction}&quot; aria-label=&quot;Voltar&quot;&gt;&lt;i data-lucide=&quot;arrow-left&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/button&gt;`
          : &#x27;&lt;div class=&quot;sq-brand-mark&quot;&gt;&lt;i data-lucide=&quot;package-search&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/div&gt;&#x27;;
        return `
          &lt;header class=&quot;sq-appbar&quot;&gt;
            ${back}
            &lt;div class=&quot;sq-appbar-text&quot;&gt;
              &lt;div class=&quot;sq-eyebrow&quot;&gt;${safe(eyebrow)}&lt;/div&gt;
              &lt;h2&gt;${safe(title)}&lt;/h2&gt;
            &lt;/div&gt;
          &lt;/header&gt;`;
      }

      function render() {
        const views = {
          login: renderLogin,
          search: renderSearch,
          results: renderResults,
          product: renderProduct,
          outcome: renderOutcome,
          success: renderSuccess,
          empty: renderEmpty,
          error: renderError
        };
        screen.innerHTML = views[state.view]();
        root.querySelectorAll(&#x27;.sq-scenario&#x27;).forEach(button =&gt; {
          const selected = button.dataset.scenario === (state.view === &#x27;empty&#x27; ? &#x27;empty&#x27; : state.view === &#x27;error&#x27; ? &#x27;error&#x27; : &#x27;flow&#x27;);
          button.setAttribute(&#x27;aria-pressed&#x27;, selected ? &#x27;true&#x27; : &#x27;false&#x27;);
        });
        icons();
      }

      function renderLogin() {
        return `
          &lt;main class=&quot;sq-screen&quot;&gt;
            &lt;div class=&quot;sq-login-hero&quot;&gt;
              &lt;div class=&quot;sq-brand-mark&quot;&gt;&lt;i data-lucide=&quot;package-search&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/div&gt;
              &lt;div&gt;
                &lt;div class=&quot;sq-eyebrow&quot;&gt;SQUAD Estoque&lt;/div&gt;
                &lt;h1&gt;Acesse o atendimento&lt;/h1&gt;
              &lt;/div&gt;
              &lt;p class=&quot;sq-helper&quot;&gt;Consulte produtos e registre o resultado diretamente no balcão.&lt;/p&gt;
            &lt;/div&gt;
            &lt;form class=&quot;sq-form&quot; data-form=&quot;login&quot;&gt;
              &lt;div class=&quot;sq-field&quot;&gt;
                &lt;label for=&quot;sq-user&quot;&gt;Usuário&lt;/label&gt;
                &lt;input class=&quot;sq-input&quot; id=&quot;sq-user&quot; name=&quot;user&quot; autocomplete=&quot;username&quot; placeholder=&quot;Digite seu usuário&quot;&gt;
              &lt;/div&gt;
              &lt;div class=&quot;sq-field&quot;&gt;
                &lt;label for=&quot;sq-password&quot;&gt;Senha&lt;/label&gt;
                &lt;input class=&quot;sq-input&quot; id=&quot;sq-password&quot; name=&quot;password&quot; type=&quot;password&quot; autocomplete=&quot;current-password&quot; placeholder=&quot;Digite sua senha&quot;&gt;
              &lt;/div&gt;
              &lt;button class=&quot;sq-button sq-button-primary&quot; type=&quot;button&quot; data-action=&quot;login&quot;&gt;Entrar &lt;i data-lucide=&quot;arrow-right&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/button&gt;
            &lt;/form&gt;
            &lt;div class=&quot;sq-spacer&quot;&gt;&lt;/div&gt;
            &lt;p class=&quot;sq-login-note&quot;&gt;Demonstração: qualquer usuário e senha avançam.&lt;/p&gt;
          &lt;/main&gt;`;
      }

      function renderSearch() {
        const banner = state.notice
          ? `&lt;div class=&quot;sq-banner&quot;&gt;&lt;i data-lucide=&quot;check-circle-2&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;${safe(state.notice)}&lt;/span&gt;&lt;/div&gt;`
          : &#x27;&#x27;;
        return `
          &lt;main class=&quot;sq-screen&quot;&gt;
            ${appbar(&#x27;Consulta rápida&#x27;, &#x27;Olá, vendedor&#x27;, &#x27;&#x27;)}
            ${banner}
            &lt;div class=&quot;sq-welcome&quot;&gt;
              &lt;h1&gt;O que o cliente procura?&lt;/h1&gt;
              &lt;p class=&quot;sq-helper&quot;&gt;Busque por nome, referência ou código do produto.&lt;/p&gt;
            &lt;/div&gt;
            &lt;form class=&quot;sq-search-panel&quot; data-form=&quot;search&quot;&gt;
              &lt;div class=&quot;sq-field&quot;&gt;
                &lt;label for=&quot;sq-query&quot;&gt;Produto ou código&lt;/label&gt;
                &lt;div class=&quot;sq-input-wrap&quot;&gt;
                  &lt;i data-lucide=&quot;search&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;
                  &lt;input class=&quot;sq-input sq-input-with-icon&quot; id=&quot;sq-query&quot; name=&quot;query&quot; value=&quot;${safe(state.query)}&quot; placeholder=&quot;Ex.: Tênis Urbano&quot; autocomplete=&quot;off&quot;&gt;
                &lt;/div&gt;
                &lt;div class=&quot;sq-error-text&quot; id=&quot;sq-query-error&quot; role=&quot;alert&quot;&gt;&lt;/div&gt;
              &lt;/div&gt;
              &lt;button class=&quot;sq-button sq-button-primary&quot; type=&quot;button&quot; data-action=&quot;search&quot;&gt;Buscar estoque &lt;i data-lucide=&quot;arrow-right&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/button&gt;
              &lt;div class=&quot;sq-tip&quot;&gt;&lt;i data-lucide=&quot;hand-pointer&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;Campo + Buscar: primeira consulta em dois toques.&lt;/span&gt;&lt;/div&gt;
            &lt;/form&gt;
            &lt;div class=&quot;sq-spacer&quot;&gt;&lt;/div&gt;
            &lt;button class=&quot;sq-button sq-button-ghost&quot; type=&quot;button&quot; data-action=&quot;logout&quot;&gt;&lt;i data-lucide=&quot;log-out&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;Sair&lt;/button&gt;
          &lt;/main&gt;`;
      }

      function renderResults() {
        return `
          &lt;main class=&quot;sq-screen&quot;&gt;
            ${appbar(&#x27;Resultados&#x27;, `Busca: ${state.query || &#x27;Tênis&#x27;}`, &#x27;back-search&#x27;)}
            &lt;p class=&quot;sq-results-meta&quot;&gt;2 produtos encontrados&lt;/p&gt;
            &lt;div class=&quot;sq-result-list&quot;&gt;
              ${products.map(product =&gt; `
                &lt;button class=&quot;sq-product-row&quot; type=&quot;button&quot; data-action=&quot;select-product&quot; data-product=&quot;${product.id}&quot;&gt;
                  &lt;span class=&quot;sq-product-thumb&quot;&gt;&lt;i data-lucide=&quot;footprints&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/span&gt;
                  &lt;span class=&quot;sq-product-copy&quot;&gt;
                    &lt;h3&gt;${safe(product.name)}&lt;/h3&gt;
                    &lt;span class=&quot;sq-caption&quot;&gt;${safe(product.detail)}&lt;/span&gt;
                  &lt;/span&gt;
                  &lt;i data-lucide=&quot;chevron-right&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;
                &lt;/button&gt;`).join(&#x27;&#x27;)}
            &lt;/div&gt;
            &lt;div class=&quot;sq-spacer&quot;&gt;&lt;/div&gt;
            &lt;button class=&quot;sq-button&quot; type=&quot;button&quot; data-action=&quot;back-search&quot;&gt;&lt;i data-lucide=&quot;search&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;Fazer outra busca&lt;/button&gt;
          &lt;/main&gt;`;
      }

      function renderProduct() {
        const product = state.product || products[0];
        const selected = product.sizes.find(size =&gt; size.number === state.size);
        return `
          &lt;main class=&quot;sq-screen&quot;&gt;
            ${appbar(&#x27;Grade disponível&#x27;, &#x27;Selecionar SKU&#x27;, &#x27;back-results&#x27;)}
            &lt;div class=&quot;sq-summary&quot;&gt;
              &lt;h3&gt;${safe(product.name)}&lt;/h3&gt;
              &lt;span class=&quot;sq-caption&quot;&gt;${safe(product.detail)} · Ref. ${safe(product.baseSku)}&lt;/span&gt;
            &lt;/div&gt;
            &lt;h3 class=&quot;sq-size-title&quot;&gt;Escolha a numeração&lt;/h3&gt;
            &lt;div class=&quot;sq-size-grid&quot; role=&quot;group&quot; aria-label=&quot;Numerações disponíveis&quot;&gt;
              ${product.sizes.map(size =&gt; `
                &lt;button class=&quot;sq-size&quot; type=&quot;button&quot; data-action=&quot;select-size&quot; data-size=&quot;${size.number}&quot; aria-pressed=&quot;${state.size === size.number ? &#x27;true&#x27; : &#x27;false&#x27;}&quot; ${size.quantity === 0 ? &#x27;disabled&#x27; : &#x27;&#x27;} aria-label=&quot;Tamanho ${size.number}, ${size.label}&quot;&gt;
                  &lt;span class=&quot;sq-size-number&quot;&gt;${size.number}&lt;/span&gt;
                  &lt;span class=&quot;sq-size-state&quot;&gt;${safe(size.label)}&lt;/span&gt;
                &lt;/button&gt;`).join(&#x27;&#x27;)}
            &lt;/div&gt;
            &lt;div class=&quot;sq-selection-live&quot; aria-live=&quot;polite&quot;&gt;${selected ? `Selecionado: ${safe(product.baseSku)}-${selected.number} · ${safe(selected.label)}` : &#x27;Selecione um tamanho disponível&#x27;}&lt;/div&gt;
            &lt;div class=&quot;sq-spacer&quot;&gt;&lt;/div&gt;
            &lt;button class=&quot;sq-button sq-button-primary&quot; type=&quot;button&quot; data-action=&quot;continue-size&quot; ${selected ? &#x27;&#x27; : &#x27;disabled&#x27;}&gt;Continuar &lt;i data-lucide=&quot;arrow-right&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/button&gt;
          &lt;/main&gt;`;
      }

      function renderOutcome() {
        const product = state.product || products[0];
        return `
          &lt;main class=&quot;sq-screen&quot;&gt;
            ${appbar(&#x27;Resultado do atendimento&#x27;, &#x27;SKU selecionado&#x27;, &#x27;back-product&#x27;)}
            &lt;div class=&quot;sq-summary&quot;&gt;
              &lt;h3&gt;${safe(product.name)} · tamanho ${safe(state.size)}&lt;/h3&gt;
              &lt;span class=&quot;sq-caption&quot;&gt;SKU ${safe(product.baseSku)}-${safe(state.size)}&lt;/span&gt;
            &lt;/div&gt;
            &lt;h1&gt;Como terminou o atendimento?&lt;/h1&gt;
            &lt;p class=&quot;sq-helper&quot;&gt;Escolha uma opção para registrar o resultado.&lt;/p&gt;
            &lt;div class=&quot;sq-outcomes&quot;&gt;
              &lt;button class=&quot;sq-button sq-button-positive&quot; type=&quot;button&quot; data-action=&quot;record&quot; data-outcome=&quot;Vendeu&quot;&gt;&lt;i data-lucide=&quot;badge-check&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;Vendeu&lt;/button&gt;
              &lt;button class=&quot;sq-button sq-button-warning&quot; type=&quot;button&quot; data-action=&quot;record&quot; data-outcome=&quot;Não tinha&quot;&gt;&lt;i data-lucide=&quot;package-x&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;Não tinha&lt;/button&gt;
              &lt;button class=&quot;sq-button sq-button-neutral&quot; type=&quot;button&quot; data-action=&quot;record&quot; data-outcome=&quot;Desistiu&quot;&gt;&lt;i data-lucide=&quot;user-round-x&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;Desistiu&lt;/button&gt;
            &lt;/div&gt;
            &lt;div class=&quot;sq-spacer&quot;&gt;&lt;/div&gt;
            &lt;button class=&quot;sq-button sq-button-ghost&quot; type=&quot;button&quot; data-action=&quot;skip&quot;&gt;&lt;i data-lucide=&quot;skip-forward&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;Pular registro e fazer nova consulta&lt;/button&gt;
            &lt;p class=&quot;sq-outcome-help&quot;&gt;Pular não salva um resultado para este atendimento.&lt;/p&gt;
          &lt;/main&gt;`;
      }

      function renderSuccess() {
        const product = state.product || products[0];
        return `
          &lt;main class=&quot;sq-screen&quot;&gt;
            &lt;div class=&quot;sq-state-center&quot;&gt;
              &lt;div class=&quot;sq-state-content&quot;&gt;
                &lt;div class=&quot;sq-state-icon sq-state-icon-success&quot;&gt;&lt;i data-lucide=&quot;check&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/div&gt;
                &lt;div class=&quot;sq-state-copy&quot;&gt;
                  &lt;div class=&quot;sq-eyebrow&quot;&gt;${safe(state.outcome)}&lt;/div&gt;
                  &lt;h1&gt;Atendimento registrado&lt;/h1&gt;
                  &lt;p&gt;O resultado foi salvo e você já pode atender o próximo cliente.&lt;/p&gt;
                &lt;/div&gt;
                &lt;span class=&quot;sq-sku-chip&quot;&gt;${safe(product.baseSku)}-${safe(state.size)}&lt;/span&gt;
                &lt;div class=&quot;sq-state-actions&quot;&gt;
                  &lt;button class=&quot;sq-button sq-button-primary&quot; type=&quot;button&quot; data-action=&quot;new-search&quot;&gt;&lt;i data-lucide=&quot;search&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;Nova consulta&lt;/button&gt;
                  &lt;button class=&quot;sq-button sq-button-ghost&quot; type=&quot;button&quot; data-action=&quot;view-outcome&quot;&gt;&lt;i data-lucide=&quot;arrow-left&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;Voltar ao resultado&lt;/button&gt;
                &lt;/div&gt;
              &lt;/div&gt;
            &lt;/div&gt;
          &lt;/main&gt;`;
      }

      function renderEmpty() {
        return `
          &lt;main class=&quot;sq-screen&quot;&gt;
            ${appbar(&#x27;Resultados&#x27;, &#x27;Busca concluída&#x27;, &#x27;back-search&#x27;)}
            &lt;div class=&quot;sq-state-center&quot;&gt;
              &lt;div class=&quot;sq-state-content&quot;&gt;
                &lt;div class=&quot;sq-state-icon&quot;&gt;&lt;i data-lucide=&quot;search-x&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/div&gt;
                &lt;div class=&quot;sq-state-copy&quot;&gt;
                  &lt;h1&gt;Nenhum produto encontrado&lt;/h1&gt;
                  &lt;p&gt;Confira o nome ou o código informado e faça uma nova busca.&lt;/p&gt;
                &lt;/div&gt;
                &lt;div class=&quot;sq-state-actions&quot;&gt;
                  &lt;button class=&quot;sq-button sq-button-primary&quot; type=&quot;button&quot; data-action=&quot;back-search&quot;&gt;&lt;i data-lucide=&quot;search&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;Alterar consulta&lt;/button&gt;
                  &lt;button class=&quot;sq-button&quot; type=&quot;button&quot; data-action=&quot;clear-search&quot;&gt;Iniciar nova consulta&lt;/button&gt;
                &lt;/div&gt;
              &lt;/div&gt;
            &lt;/div&gt;
          &lt;/main&gt;`;
      }

      function renderError() {
        return `
          &lt;main class=&quot;sq-screen&quot;&gt;
            ${appbar(&#x27;Consulta rápida&#x27;, &#x27;Falha na consulta&#x27;, &#x27;back-search&#x27;)}
            &lt;div class=&quot;sq-state-center&quot;&gt;
              &lt;div class=&quot;sq-state-content&quot;&gt;
                &lt;div class=&quot;sq-state-icon sq-state-icon-error&quot;&gt;&lt;i data-lucide=&quot;wifi-off&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/div&gt;
                &lt;div class=&quot;sq-state-copy&quot;&gt;
                  &lt;h1&gt;Não foi possível consultar agora&lt;/h1&gt;
                  &lt;p&gt;Verifique a conexão e tente novamente. Sua busca foi preservada.&lt;/p&gt;
                &lt;/div&gt;
                &lt;div class=&quot;sq-state-actions&quot;&gt;
                  &lt;button class=&quot;sq-button sq-button-primary&quot; type=&quot;button&quot; data-action=&quot;retry&quot;&gt;&lt;i data-lucide=&quot;refresh-cw&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;Tentar novamente&lt;/button&gt;
                  &lt;button class=&quot;sq-button&quot; type=&quot;button&quot; data-action=&quot;clear-search&quot;&gt;Nova consulta&lt;/button&gt;
                &lt;/div&gt;
              &lt;/div&gt;
            &lt;/div&gt;
          &lt;/main&gt;`;
      }

      root.addEventListener(&#x27;submit&#x27;, event =&gt; {
        event.preventDefault();
        if (event.target.dataset.form === &#x27;login&#x27;) {
          state.notice = &#x27;&#x27;;
          state.view = &#x27;search&#x27;;
          render();
          return;
        }
        if (event.target.dataset.form === &#x27;search&#x27;) {
          const query = new FormData(event.target).get(&#x27;query&#x27;).trim();
          const error = root.querySelector(&#x27;#sq-query-error&#x27;);
          if (!query) {
            error.textContent = &#x27;Digite um produto ou código para buscar.&#x27;;
            root.querySelector(&#x27;#sq-query&#x27;).focus();
            return;
          }
          state.query = query;
          state.notice = &#x27;&#x27;;
          if (/vazio|nada|xyz/i.test(query)) state.view = &#x27;empty&#x27;;
          else if (/erro|offline/i.test(query)) state.view = &#x27;error&#x27;;
          else state.view = &#x27;results&#x27;;
          render();
        }
      });

      root.addEventListener(&#x27;click&#x27;, event =&gt; {
        const scenario = event.target.closest(&#x27;[data-scenario]&#x27;);
        if (scenario) {
          const choice = scenario.dataset.scenario;
          state.view = choice === &#x27;flow&#x27; ? &#x27;login&#x27; : choice;
          state.query = choice === &#x27;empty&#x27; ? &#x27;Produto inexistente&#x27; : choice === &#x27;error&#x27; ? &#x27;Tênis Urbano&#x27; : &#x27;&#x27;;
          state.product = null;
          state.size = null;
          state.outcome = &#x27;&#x27;;
          state.notice = &#x27;&#x27;;
          render();
          return;
        }

        const control = event.target.closest(&#x27;[data-action]&#x27;);
        if (!control || control.disabled) return;
        const action = control.dataset.action;

        if (action === &#x27;login&#x27;) {
          state.notice = &#x27;&#x27;;
          state.view = &#x27;search&#x27;;
        }
        if (action === &#x27;search&#x27;) {
          const queryInput = root.querySelector(&#x27;#sq-query&#x27;);
          const query = (queryInput ? queryInput.value : state.query).trim();
          const error = root.querySelector(&#x27;#sq-query-error&#x27;);
          if (!query) {
            error.textContent = &#x27;Digite um produto ou código para buscar.&#x27;;
            queryInput.focus();
            return;
          }
          state.query = query;
          state.notice = &#x27;&#x27;;
          if (/vazio|nada|xyz/i.test(query)) state.view = &#x27;empty&#x27;;
          else if (/erro|offline/i.test(query)) state.view = &#x27;error&#x27;;
          else state.view = &#x27;results&#x27;;
        }
        if (action === &#x27;logout&#x27;) state.view = &#x27;login&#x27;;
        if (action === &#x27;back-search&#x27;) state.view = &#x27;search&#x27;;
        if (action === &#x27;back-results&#x27;) state.view = &#x27;results&#x27;;
        if (action === &#x27;back-product&#x27;) state.view = &#x27;product&#x27;;
        if (action === &#x27;view-outcome&#x27;) state.view = &#x27;outcome&#x27;;
        if (action === &#x27;select-product&#x27;) {
          state.product = products.find(product =&gt; product.id === control.dataset.product);
          state.size = null;
          state.view = &#x27;product&#x27;;
        }
        if (action === &#x27;select-size&#x27;) {
          state.size = control.dataset.size;
        }
        if (action === &#x27;continue-size&#x27;) state.view = &#x27;outcome&#x27;;
        if (action === &#x27;record&#x27;) {
          state.outcome = control.dataset.outcome;
          state.view = &#x27;success&#x27;;
        }
        if (action === &#x27;skip&#x27;) {
          state.query = &#x27;&#x27;;
          state.product = null;
          state.size = null;
          state.notice = &#x27;Registro ignorado. Pronto para uma nova consulta.&#x27;;
          state.view = &#x27;search&#x27;;
        }
        if (action === &#x27;new-search&#x27; || action === &#x27;clear-search&#x27;) {
          state.query = &#x27;&#x27;;
          state.product = null;
          state.size = null;
          state.outcome = &#x27;&#x27;;
          state.notice = action === &#x27;new-search&#x27; ? &#x27;Atendimento concluído. Inicie uma nova consulta.&#x27; : &#x27;&#x27;;
          state.view = &#x27;search&#x27;;
        }
        if (action === &#x27;retry&#x27;) state.view = &#x27;results&#x27;;
        render();
      });

      render();
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
