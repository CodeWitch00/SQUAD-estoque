# Override temporario para provar que um volume novo inicia banco independente.
# Container/porta isolados para nao conflitar com o servico principal.
services:
  squad-estoque:
    container_name: squad-estoque-fresh
    ports: !override
      - "8081:8080"
    environment:
      AllowedHosts: "localhost;127.0.0.1"
    volumes: !override
      - squad-estoque-data-fresh:/app/data

volumes:
  squad-estoque-data-fresh:
    name: squad-estoque-data-fresh
