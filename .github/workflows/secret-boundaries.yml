name: Secret file boundaries

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-probes:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Git and publish exclusions
        if: runner.os == 'Windows'
        run: python scripts/test-secret-boundaries.py
      - name: Verify Git, publish and Docker context exclusions
        if: runner.os == 'Linux'
        run: python scripts/test-secret-boundaries.py --docker
