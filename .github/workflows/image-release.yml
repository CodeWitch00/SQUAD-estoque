name: Versioned Docker image

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full commit SHA approved on main
        required: true
        type: string
      publish:
        description: Publish the validated image to GHCR
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: image-release
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check approved reference
        env:
          APPROVED_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'A full lowercase commit SHA is required.' >&2; exit 1; }
          git init -q validation
          git -C validation remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C validation fetch -q --depth=1 origin main
          git -C validation cat-file -e "$APPROVED_SHA^{commit}" || { echo 'Approved commit is not the current main head.' >&2; exit 1; }
          test "$(git -C validation rev-parse origin/main)" = "$APPROVED_SHA" || { echo 'Approved commit is not the current main head.' >&2; exit 1; }
      - name: Checkout approved commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: |
          dotnet restore src/SquadEstoque.Web/SquadEstoque.Web.csproj
          dotnet restore tests/SquadEstoque.Web.Tests/SquadEstoque.Web.Tests.csproj
      - name: Build
        run: |
          dotnet build src/SquadEstoque.Web/SquadEstoque.Web.csproj -c Release --no-restore
          dotnet build tests/SquadEstoque.Web.Tests/SquadEstoque.Web.Tests.csproj -c Release --no-restore
      - name: Test
        run: dotnet test tests/SquadEstoque.Web.Tests/SquadEstoque.Web.Tests.csproj -c Release --no-build
      - name: Build versioned image
        env:
          APPROVED_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${APPROVED_SHA}"
          docker build --pull --tag "$image" .
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo "Validated image: $image" >> "$GITHUB_STEP_SUMMARY"
          docker image inspect "$image" --format 'Local image ID: {{.Id}}' >> "$GITHUB_STEP_SUMMARY"
      - name: Authenticate to GHCR
        if: inputs.publish
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish approved image
        if: inputs.publish
        run: |
          set -euo pipefail
          docker push "$IMAGE"
          echo "Published: $IMAGE" >> "$GITHUB_STEP_SUMMARY"
          docker image inspect "$IMAGE" --format 'Digest: {{join .RepoDigests ", "}}' >> "$GITHUB_STEP_SUMMARY"
