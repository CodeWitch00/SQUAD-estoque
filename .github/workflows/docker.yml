name: Docker build and smoke test

on:
  push:
    paths:
      - Dockerfile
      - .dockerignore
      - src/SquadEstoque.Web/**
      - scripts/validate-docker.sh
      - .github/workflows/docker.yml
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - src/SquadEstoque.Web/**
      - scripts/validate-docker.sh
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build, inspect and start image
        run: bash scripts/validate-docker.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-evidence
          path: artifacts/docker/
          if-no-files-found: error
